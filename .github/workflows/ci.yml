name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - run: python -m pip install -r requirements.txt pytest==9.0.3 ruff==0.15.12
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: python -m pytest -q
