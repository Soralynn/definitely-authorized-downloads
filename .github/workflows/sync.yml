name: KodeKloud Auto Downloader & Sync
on:
  workflow_dispatch:
    inputs:
      course_url:
        description: HTTPS KodeKloud course URL
        required: true
        type: string
      quality:
        description: Video quality (keep the same when resuming)
        type: choice
        options: [1080p, 720p, 540p, 480p, 360p]
        default: 1080p
      drive_destination:
        description: Rclone destination (remote name must match RCLONE_CONFIG)
        type: string
        default: 'CloudDriveRemote:KodeKloud'
        required: true
permissions:
  contents: read
concurrency:
  group: kodekloud-drive-sync
  cancel-in-progress: false
jobs:
  download_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required secrets
        env:
          KK_COOKIES: ${{ secrets.KK_COOKIES }}
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for key in ('KK_COOKIES', 'RCLONE_CONFIG_TEXT'):
              if not os.environ.get(key, '').strip():
                  raise SystemExit(f'Missing secret: {key}. Forks do not inherit repository secrets.')
          config = Path(os.environ['RUNNER_TEMP']) / 'rclone.conf'
          config.touch(mode=0o600)
          config.write_text(os.environ['RCLONE_CONFIG_TEXT'], encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'RCLONE_CONFIG={config}\n')
          PY
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install -r requirements.txt
      - name: Download, verify uploads, and save progress
        env:
          KK_COOKIES: ${{ secrets.KK_COOKIES }}
          COURSE_URL: ${{ inputs.course_url }}
          QUALITY: ${{ inputs.quality }}
          DRIVE_DESTINATION: ${{ inputs.drive_destination }}
        run: python scripts/sync_course.py
      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'rclone.conf').unlink(missing_ok=True)
          PY
