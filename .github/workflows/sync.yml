name: KodeKloud Auto Downloader & Sync

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL of the KodeKloud course to download'
        required: true
        default: 'https://learn.kodekloud.com/learn/courses/crash-course-docker-for-absolute-beginner'
        type: string
      session_cookie:
        description: 'Your KodeKloud _secure-user-session token'
        required: true
        type: string

jobs:
  download_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg on Linux Runner
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install KodeKloud Downloader
        run: pip install git+https://github.com/debakarr/kodekloud-downloader.git

      - name: Create Cookie File
        run: |
          printf ".kodekloud.com\tTRUE\t/\tTRUE\t0\tsession-cookie\t%s\n" "${{ inputs.session_cookie }}" > cookies.txt

      - name: Download Course
        run: python -m kodekloud_downloader.cli dl -o ./CourseDownload -c cookies.txt "${{ inputs.course_url }}"

      - name: Setup Rclone
        run: sudo curl https://rclone.org/install.sh | sudo bash

      - name: Sync to Cloud Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF
          rclone copy ./CourseDownload CloudDriveRemote:KodeKloud/ --progress
