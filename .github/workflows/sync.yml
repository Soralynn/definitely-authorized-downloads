name: KodeKloud to Cloud Drive

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL of the KodeKloud course to download'
        required: true
        type: string

jobs:
  download_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install KodeKloud Downloader
        run: pip install git+https://github.com/debakarr/kodekloud-downloader.git

      - name: Download Course
        run: |
          kodekloud-downloader --email ${{ secrets.KK_EMAIL }} \
                               --password ${{ secrets.KK_PASSWORD }} \
                               --course ${{ inputs.course_url }}

      - name: Setup Rclone
        uses: animcogn/setup-rclone@v1

      - name: Sync to Cloud Drive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf
          # Syncs downloaded files to a 'KodeKloud' folder on Google Drive
          rclone copy ./ CloudDriveRemote:KodeKloud/ --progress --exclude ".git/**" --exclude ".github/**"
