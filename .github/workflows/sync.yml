name: KodeKloud to Cloud Drive

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL of the KodeKloud course to download'
        required: true
        type: string

jobs:
  download_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install KodeKloud Downloader
        run: pip install git+https://github.com/debakarr/kodekloud-downloader.git

      - name: Create Cookie File
        env:
          KK_COOKIES: ${{ secrets.KK_COOKIES }}
        run: echo "$KK_COOKIES" > cookies.txt

      - name: Download Course
        run: kodekloud dl -o ./CourseDownload -c cookies.txt "${{ inputs.course_url }}"

      - name: Setup Rclone
        run: sudo curl https://rclone.org/install.sh | sudo bash

      - name: Sync to Cloud Drive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf
          # Syncs ONLY the downloaded course folder to Google Drive
          rclone copy ./CourseDownload CloudDriveRemote:KodeKloud/ --progress
