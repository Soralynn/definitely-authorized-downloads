name: KodeKloud to Cloud Drive

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL of the KodeKloud course to download'
        required: true
        type: string

jobs:
  download_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install KodeKloud Downloader
        run: pip install git+https://github.com/debakarr/kodekloud-downloader.git

      - name: Debug and Create Cookie File
        env:
          KK_COOKIES: ${{ secrets.KK_COOKIES }}
        run: |
          if [ -z "$KK_COOKIES" ]; then
            echo "::error::KK_COOKIES secret is empty or not set"
            exit 1
          fi

          echo "KK_COOKIES length: ${#KK_COOKIES}"

          # Optional: show first line type to verify format (no secrets printed)
          echo "$KK_COOKIES" | head -n 1

          echo "$KK_COOKIES" > cookies.txt

          # Show file size to confirm it's not empty
          ls -lh cookies.txt

      - name: Download Course
        run: kodekloud dl -o ./CourseDownload -c cookies.txt "${{ inputs.course_url }}"

      - name: Setup Rclone
        run: sudo curl https://rclone.org/install.sh | sudo bash

      - name: Sync to Cloud Drive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf
          rclone copy ./CourseDownload CloudDriveRemote:KodeKloud/ --progress
