<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- title -->
  <text x="600" y="110" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="48" font-weight="700" fill="#ffffff" opacity="0.95">
    ☁️ KodeKloud Course Sync
  </text>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="18" fill="#bfdbfe">
    Organize authorized course materials locally and move them safely to Google Drive
  </text>

  <!-- snowflakes: each circle drifts down and loops, with slight horizontal sway -->
  <g fill="#ffffff">
    <!-- Row of generated snowflakes with varied size/speed/delay -->
    <circle cx="40"   cy="0" r="2.5" opacity="0.9">
      <animate attributeName="cy" from="-10" to="230" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="40;55;40" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110"  cy="0" r="1.8" opacity="0.7">
      <animate attributeName="cy" from="-10" to="230" dur="8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="110;95;110" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180"  cy="0" r="3"   opacity="0.95">
      <animate attributeName="cy" from="-10" to="230" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180;200;180" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250"  cy="0" r="2"   opacity="0.8">
      <animate attributeName="cy" from="-10" to="230" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="250;235;250" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320"  cy="0" r="2.4" opacity="0.85">
      <animate attributeName="cy" from="-10" to="230" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="320;340;320" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390"  cy="0" r="1.6" opacity="0.6">
      <animate attributeName="cy" from="-10" to="230" dur="9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="390;375;390" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460"  cy="0" r="2.8" opacity="0.9">
      <animate attributeName="cy" from="-10" to="230" dur="5.5s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="460;480;460" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530"  cy="0" r="2"   opacity="0.75">
      <animate attributeName="cy" from="-10" to="230" dur="7.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="530;515;530" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600"  cy="0" r="2.3" opacity="0.85">
      <animate attributeName="cy" from="-10" to="230" dur="6.2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;620;600" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670"  cy="0" r="1.9" opacity="0.7">
      <animate attributeName="cy" from="-10" to="230" dur="8.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="670;655;670" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740"  cy="0" r="2.6" opacity="0.9">
      <animate attributeName="cy" from="-10" to="230" dur="5.8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="740;760;740" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810"  cy="0" r="1.7" opacity="0.65">
      <animate attributeName="cy" from="-10" to="230" dur="9.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="810;795;810" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880"  cy="0" r="2.9" opacity="0.95">
      <animate attributeName="cy" from="-10" to="230" dur="5.3s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="880;900;880" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950"  cy="0" r="2.1" opacity="0.8">
      <animate attributeName="cy" from="-10" to="230" dur="7.1s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="950;935;950" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="0" r="2.4" opacity="0.85">
      <animate attributeName="cy" from="-10" to="230" dur="6.7s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1020;1040;1020" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="0" r="1.8" opacity="0.7">
      <animate attributeName="cy" from="-10" to="230" dur="8.6s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1090;1075;1090" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="0" r="2.7" opacity="0.9">
      <animate attributeName="cy" from="-10" to="230" dur="5.9s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1160;1180;1160" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- second, denser layer of smaller/faster flakes -->
    <circle cx="75"   cy="0" r="1.2" opacity="0.5">
      <animate attributeName="cy" from="-10" to="230" dur="4.5s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220"  cy="0" r="1.3" opacity="0.55">
      <animate attributeName="cy" from="-10" to="230" dur="4.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360"  cy="0" r="1.1" opacity="0.5">
      <animate attributeName="cy" from="-10" to="230" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500"  cy="0" r="1.4" opacity="0.6">
      <animate attributeName="cy" from="-10" to="230" dur="5.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640"  cy="0" r="1.2" opacity="0.5">
      <animate attributeName="cy" from="-10" to="230" dur="4.6s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780"  cy="0" r="1.3" opacity="0.55">
      <animate attributeName="cy" from="-10" to="230" dur="4.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920"  cy="0" r="1.1" opacity="0.5">
      <animate attributeName="cy" from="-10" to="230" dur="4.3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="0" r="1.4" opacity="0.6">
      <animate attributeName="cy" from="-10" to="230" dur="5.3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="0" r="1.2" opacity="0.5">
      <animate attributeName="cy" from="-10" to="230" dur="4.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
